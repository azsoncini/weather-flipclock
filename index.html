<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Weather Clock</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Varela+Round&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Varela Round', sans-serif;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        .container {
            display: flex;
            width: 95vw;
            height: 90vh;
            position: relative;
        }

        .left-panel, .right-panel {
            flex: 1;
            padding: 2em;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .left-panel {
            flex: 2;
            justify-content: center;
            align-items: center;
        }
        
        .right-panel {
            justify-content: center;
            align-items: center;
        }

        #time {
            font-family: 'Orbitron', sans-serif;
            font-size: 12vw;
            font-weight: 900;
            line-height: 1;
        }

        #date {
            font-size: 2.5vw;
            font-weight: 400;
            margin-top: 1em;
            letter-spacing: 2px;
        }

        #weather-icon {
            width: 75%;
            filter: invert(1);
            margin-bottom: 1em;
        }

        .weather-details {
            font-size: 3.75vw;
            width: 100%;
            text-align: center;
            line-height: 1.25;
            font-weight: 400;
        }
        sup {
            font-size: 0.6em;
        }

        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .settings-overlay.hidden {
            display: none;
        }

        .settings-box {
            background: #111;
            padding: 2em;
            border: 1px solid #fff;
            text-align: center;
            min-width: 300px;
            max-width: 90vw;
        }

        .settings-box h2 {
            margin-top: 0;
            font-family: 'Orbitron', sans-serif;
        }

        .input-group {
            margin-bottom: 1em;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5em;
        }

        .input-group input {
            box-sizing: border-box;
            width: 100%;
            padding: 0.5em;
            background: #000;
            border: 1px solid #fff;
            color: #fff;
            font-family: 'Varela Round', sans-serif;
        }

        .settings-box button {
            background: #000;
            color: #fff;
            border: 1px solid #fff;
            padding: 0.75em 1.5em;
            font-family: 'Varela Round', sans-serif;
            cursor: pointer;
            margin: 0.5em;
        }

        .settings-box button:hover {
            background: #fff;
            color: #000;
        }

        .spinner {
            display: inline-block;
            width: 1em;
            height: 1em;
            vertical-align: -0.125em;
            border: 0.15em solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spin .75s linear infinite;
            margin-left: 0.5em;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <div id="time">--:--:--</div>
            <div id="date">----------</div>
        </div>
        <div class="right-panel">
            <img id="weather-icon" src="" alt="Weather Icon">
            <div class="weather-details">
                <div id="precip-chance">--% (--h)</div>
                <div id="temp-min"><small>Min:</small> <b>--°</b></div>
                <div id="temp-max"><small>Max:</small> <b>--°</b></div>
            </div>
        </div>
    </div>

    <div id="settings-overlay" class="settings-overlay hidden">
        <div class="settings-box">
            <h2>Settings</h2>
            <div class="input-group">
                <label for="lat-input">Latitude:</label>
                <input type="text" id="lat-input">
            </div>
            <div class="input-group">
                <label for="lon-input">Longitude:</label>
                <input type="text" id="lon-input">
            </div>
            <button id="get-location-btn">Use Current Location <span id="location-spinner" class="spinner hidden"></span></button>
            <button id="close-settings-btn">Save &amp; Close</button>
        </div>
    </div>

    <script>
        let currentLat = localStorage.getItem('lat') || "51.5072";
        let currentLon = localStorage.getItem('lon') || "-0.1276";

        const API_URL = "https://api.open-meteo.com/v1/forecast";
        const DAILY_VARS = "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_hours";
        const FORECAST_DAYS = "1";
        const ICON_BASE_URL = "https://raw.githubusercontent.com/erikflowers/weather-icons/master/svg/";

        function updateTime() {
            const now = new Date();
            const timeString = now.toTimeString().slice(0, 5);
            document.getElementById('time').textContent = timeString;

            const day = now.getDate();
            let suffix;
            if (day > 3 && day < 21) {
                suffix = 'th';
            } else {
                switch (day % 10) {
                    case 1:  suffix = "st"; break;
                    case 2:  suffix = "nd"; break;
                    case 3:  suffix = "rd"; break;
                    default: suffix = "th";
                }
            }
            const dateString = `${day}<sup>${suffix}</sup> ${now.toLocaleString('default', { month: 'short' })} ${now.getFullYear()}`;
            document.getElementById('date').innerHTML = dateString.toUpperCase();
        }

        function getWeatherIconName(code) {
            const iconMap = {
                0: "wi-day-sunny.svg", 1: "wi-day-cloudy.svg", 2: "wi-cloudy.svg",
                3: "wi-cloudy.svg", 45: "wi-fog.svg", 48: "wi-fog.svg",
                51: "wi-sprinkle.svg", 53: "wi-sprinkle.svg", 55: "wi-sprinkle.svg",
                56: "wi-sleet.svg", 57: "wi-sleet.svg", 61: "wi-day-rain.svg",
                63: "wi-rain.svg", 65: "wi-rain.svg", 66: "wi-sleet.svg",
                67: "wi-sleet.svg", 71: "wi-snow.svg", 73: "wi-snow.svg",
                75: "wi-snow.svg", 77: "wi-snow.svg", 80: "wi-day-showers.svg",
                81: "wi-showers.svg", 82: "wi-showers.svg", 85: "wi-day-snow.svg",
                86: "wi-day-snow.svg", 95: "wi-thunderstorm.svg",
                96: "wi-storm-showers.svg", 99: "wi-storm-showers.svg",
            };
            return iconMap[code] || "wi-na.svg";
        }

        async function fetchWeather() {
            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

            const params = new URLSearchParams({
                latitude: currentLat,
                longitude: currentLon,
                daily: DAILY_VARS,
                timezone: timezone,
                forecast_days: FORECAST_DAYS,
            });
            const url = `${API_URL}?${params}`;

            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                if (data.error) {
                    console.error("Weather API Error:", data.reason);
                    return;
                }

                const daily = data.daily;
                const weatherCode = daily.weather_code[0];
                const tempMax = Math.round(daily.temperature_2m_max[0]);
                const tempMin = Math.round(daily.temperature_2m_min[0]);
                const precipChance = daily.precipitation_probability_max[0];
                const precipHours = daily.precipitation_hours[0];

                document.getElementById('precip-chance').textContent = `${precipChance}% (${precipHours}h)`;
                document.getElementById('temp-min').innerHTML = `<small>Min:</small> <b>${tempMin}°</b>`;
                document.getElementById('temp-max').innerHTML = `<small>Max:</small> <b>${tempMax}°</b>`;

                const iconName = getWeatherIconName(weatherCode);
                const iconUrl = `${ICON_BASE_URL}${iconName}`;
                document.getElementById('weather-icon').src = iconUrl;

            } catch (error) {
                console.error("Error fetching weather data:", error);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateTime();
            setInterval(updateTime, 1000);
            
            fetchWeather();
            // Fetch weather every hour
            setInterval(fetchWeather, 3600000);

            // Long press for settings
            let pressTimer;

            function startPress(e) {
                // Don't trigger on settings modal or its children
                if (e.target.closest('#settings-overlay')) {
                    return;
                }
                pressTimer = window.setTimeout(function () {
                    const settingsOverlay = document.getElementById('settings-overlay');
                    document.getElementById('lat-input').value = currentLat;
                    document.getElementById('lon-input').value = currentLon;
                    settingsOverlay.classList.remove('hidden');
                }, 1000); // 1 second
            }

            function cancelPress() {
                clearTimeout(pressTimer);
            }

            const body = document.body;
            body.addEventListener("mousedown", startPress);
            body.addEventListener("touchstart", startPress, { passive: true });
            body.addEventListener("mouseup", cancelPress);
            body.addEventListener("mouseleave", cancelPress);
            body.addEventListener("touchend", cancelPress);
            body.addEventListener("touchcancel", cancelPress);

            // Settings UI event listeners
            document.getElementById('close-settings-btn').addEventListener('click', () => {
                const lat = document.getElementById('lat-input').value;
                const lon = document.getElementById('lon-input').value;

                if (lat && lon) {
                    currentLat = lat;
                    currentLon = lon;
                    localStorage.setItem('lat', lat);
                    localStorage.setItem('lon', lon);
                    fetchWeather();
                }
                document.getElementById('settings-overlay').classList.add('hidden');
            });

            document.getElementById('get-location-btn').addEventListener('click', () => {
                const spinner = document.getElementById('location-spinner');
                if ('geolocation' in navigator) {
                    spinner.classList.remove('hidden');
                    navigator.geolocation.getCurrentPosition(position => {
                        const lat = position.coords.latitude.toFixed(4);
                        const lon = position.coords.longitude.toFixed(4);
                        document.getElementById('lat-input').value = lat;
                        document.getElementById('lon-input').value = lon;
                        spinner.classList.add('hidden');
                    }, error => {
                        console.error("Geolocation error:", error);
                        alert("Could not get location. Please enter manually or check permissions.");
                        spinner.classList.add('hidden');
                    });
                } else {
                    alert("Geolocation is not supported by your browser.");
                }
            });
        });
    </script>
</body>
</html>
