<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Weather Flip Clock</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Offside&family=Outfit:wght@800;900&family=Roboto+Condensed:wght@700;800;900&family=Zen+Dots&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
    <style>
        :root {
            --font-offset: 0px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Roboto Condensed', sans-serif;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        .container {
            display: flex;
            flex-direction: row;
            width: 100vw;
            height: 100vh;
            padding: 2vh 2vw;
            position: relative;
            align-items: center;
            justify-content: space-between;
            gap: 1.5vw;
        }

        .left-panel {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
        }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-width: 0;
        }

        .clock-container {
            display: flex;
            gap: 1.5vmin;
            justify-content: flex-start;
            align-items: flex-start;
        }

        .clock-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .top-label {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: clamp(14px, 4.5vmin, 32px);
            font-weight: 700;
            color: #b5b5b7;
            margin-bottom: 1vmin;
            letter-spacing: 0.5px;
        }

        .flip-clock-card {
            position: relative;
            width: clamp(110px, 26vw, 60vh);
            height: clamp(110px, 26vw, 60vh);
            background: #1c1c1e;
            border-radius: 4vmin;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            font-family: 'Roboto Condensed', sans-serif;
            font-weight: 800;
            font-size: clamp(90px, 22vw, 52vh);
            color: #b5b5b7;
            perspective: 1000px;
        }

        .card-face {
            position: absolute;
            left: 0;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: #1c1c1e;
            user-select: none;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            justify-content: center;
        }

        .card-text {
            position: absolute;
            width: 100%;
            height: 200%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            left: 0;
            transform: translateY(var(--font-offset));
        }

        .card-face.top {
            top: 0;
            border-top-left-radius: 4vmin;
            border-top-right-radius: 4vmin;
        }

        .card-face.top .card-text {
            top: 0;
        }

        .card-face.bottom {
            bottom: 0;
            border-bottom-left-radius: 4vmin;
            border-bottom-right-radius: 4vmin;
        }

        .card-face.bottom .card-text {
            bottom: 0;
        }

        .flip-clock-card .top-back { z-index: 1; }
        .flip-clock-card .bottom-back { z-index: 2; }
        .flip-clock-card .top-front { z-index: 3; transform-origin: bottom; }
        .flip-clock-card .bottom-front { z-index: 4; transform-origin: top; transform: rotateX(90deg); }

        .flip-clock-card.flipping .top-front {
            animation: flipTopFront 0.25s ease-in forwards;
        }

        .flip-clock-card.flipping .bottom-front {
            animation: flipBottomFront 0.25s ease-out 0.25s forwards;
        }

        @keyframes flipTopFront {
            0% { transform: rotateX(0deg); }
            100% { transform: rotateX(-90deg); }
        }

        @keyframes flipBottomFront {
            0% { transform: rotateX(90deg); }
            100% { transform: rotateX(0deg); }
        }

        .flip-clock-card::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: #000;
            z-index: 10;
            transform: translateY(-50%);
        }

        .seconds-container {
            position: absolute;
            bottom: 0;
            right: 2vmin;
            z-index: 20;
            display: flex;
        }

        .seconds-card {
            position: relative;
            width: clamp(25px, 6vw, 12vh);
            height: clamp(20px, 4.5vw, 9vh);
            background: #1c1c1e;
            border-top-left-radius: 1.5vmin;
            border-top-right-radius: 1.5vmin;
            border-bottom-left-radius: 4vmin;
            border-bottom-right-radius: 4vmin;
            font-family: 'Roboto Condensed', sans-serif;
            font-weight: 800;
            font-size: clamp(18px, 4vw, 8vh);
            color: #b5b5b7;
            box-shadow: none;
            perspective: 500px;
            border: none;
            overflow: hidden;
            transform: translateZ(0);
        }

        .seconds-card .card-face {
            background: #1c1c1e;
            will-change: transform;
        }

        .seconds-card .card-face.top {
            border-top-left-radius: 1.5vmin;
            border-top-right-radius: 1.5vmin;
        }

        .seconds-card .card-face.bottom {
            border-bottom-left-radius: 4vmin;
            border-bottom-right-radius: 4vmin;
        }

        .seconds-card .top-back { z-index: 1; }
        .seconds-card .bottom-back { z-index: 2; }
        .seconds-card .top-front { z-index: 3; transform-origin: bottom; }
        .seconds-card .bottom-front { z-index: 4; transform-origin: top; transform: rotateX(90deg); }

        .seconds-card.flipping .top-front {
            animation: flipTopFront 0.2s ease-in forwards;
        }

        .seconds-card.flipping .bottom-front {
            animation: flipBottomFront 0.2s ease-out 0.2s forwards;
        }

        .seconds-card::after {
            display: none;
        }

        .seconds-container.hidden {
            display: none;
        }

        .weather-icons-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5em;
            margin-bottom: 1.5vh;
        }

        .weather-icon-img {
            width: clamp(40px, 8vw, 14vh);
            height: clamp(40px, 8vw, 14vh);
            filter: invert(1);
        }

        .weather-arrow-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 0.8;
        }

        .weather-arrow-label {
            font-size: clamp(10px, 1.8vw, 2.2vh);
            font-weight: 700;
            color: #aaa;
            margin-bottom: -4px;
        }

        .weather-arrow-icon {
            font-size: clamp(28px, 5vw, 8vh) !important;
        }

        .wi-icon-small {
            width: 1.1em;
            height: 1.1em;
            filter: invert(1);
            vertical-align: middle;
            display: inline-block;
        }

        .temp-humidity-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.2em;
            font-size: clamp(24px, 5vw, 8.5vh);
            font-weight: 800;
            margin-bottom: 1.5vh;
            flex-wrap: nowrap;
            white-space: nowrap;
        }

        .temp-group, .humidity-group {
            display: flex;
            align-items: center;
            gap: 0.1em;
        }

        .weather-details {
            font-size: clamp(15px, 2.5vw, 3.8vh);
            width: 100%;
            text-align: center;
            line-height: 1.4;
            font-weight: 500;
            white-space: nowrap;
        }

        .rain-table-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6em;
            margin-bottom: 1.5vh;
            font-size: clamp(15px, 2.3vw, 3.6vh);
        }

        .rain-columns {
            display: flex;
            gap: 0.8em;
            text-align: center;
        }

        .rain-col {
            display: flex;
            flex-direction: column;
        }

        .rain-header {
            font-size: 0.75em;
            color: #aaa;
        }

        .temp-min-max {
            font-size: clamp(15px, 2.3vw, 3.6vh);
            margin-bottom: 1.5vh;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6em;
        }

        .temp-min-max .item {
            display: flex;
            align-items: center;
            gap: 0.2em;
        }

        #wind-info {
            font-size: clamp(15px, 2.3vw, 3.6vh);
            color: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4em;
            margin-bottom: 2vh;
        }

        .progress-bar-container {
            width: 80%;
            max-width: 350px;
            margin: 0 auto;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: #666;
        }

        .material-symbols-outlined {
            font-size: 1.2em;
            vertical-align: middle;
            display: inline-block;
        }

        .wind-arrow {
            transition: transform 0.5s ease-in-out;
        }

        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .settings-overlay.hidden { display: none; }

        .settings-box {
            background: #111;
            padding: 2em;
            border: 1px solid #333;
            border-radius: 12px;
            text-align: center;
            min-width: 300px;
            max-width: 90vw;
            color: #fff;
        }

        .settings-box h2 { margin-top: 0; font-family: 'Roboto Condensed', sans-serif; }

        .input-group { margin-bottom: 1em; text-align: left; }
        .input-group label { display: block; margin-bottom: 0.5em; font-size: 0.9em; }

        .input-group input[type="text"], .input-group select {
            box-sizing: border-box;
            width: 100%;
            padding: 0.6em;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            font-family: inherit;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5em;
            margin-bottom: 1em;
            text-align: left;
            cursor: pointer;
        }

        .checkbox-group input { width: 1.2em; height: 1.2em; cursor: pointer; }

        .settings-box button {
            background: #333;
            color: #fff;
            border: none;
            padding: 0.75em 1.5em;
            border-radius: 6px;
            font-family: inherit;
            cursor: pointer;
            margin: 0.3em;
        }

        .settings-box button:hover { background: #555; }

        .spinner {
            display: inline-block;
            width: 1em;
            height: 1em;
            vertical-align: -0.125em;
            border: 0.15em solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spin .75s linear infinite;
            margin-left: 0.5em;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <div class="clock-container">
                <div class="clock-column">
                    <div id="date-label" class="top-label">00/00/0000</div>
                    <div id="hours-card" class="flip-clock-card">
                        <div class="card-face top top-back"><div class="card-text">00</div></div>
                        <div class="card-face bottom bottom-back"><div class="card-text">00</div></div>
                        <div class="card-face top top-front"><div class="card-text">00</div></div>
                        <div class="card-face bottom bottom-front"><div class="card-text">00</div></div>
                    </div>
                </div>

                <div class="clock-column">
                    <div id="day-label" class="top-label">sábado</div>
                    <div id="minutes-card" class="flip-clock-card">
                        <div class="card-face top top-back"><div class="card-text">00</div></div>
                        <div class="card-face bottom bottom-back"><div class="card-text">00</div></div>
                        <div class="card-face top top-front"><div class="card-text">00</div></div>
                        <div class="card-face bottom bottom-front"><div class="card-text">00</div></div>

                        <div id="seconds-container" class="seconds-container hidden">
                            <div id="seconds-card" class="seconds-card">
                                <div class="card-face top top-back"><div class="card-text">00</div></div>
                                <div class="card-face bottom bottom-back"><div class="card-text">00</div></div>
                                <div class="card-face top top-front"><div class="card-text">00</div></div>
                                <div class="card-face bottom bottom-front"><div class="card-text">00</div></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <div class="weather-icons-group">
                <img id="weather-icon-now" class="weather-icon-img" src="" alt="Tempo Atual">
                <div class="weather-arrow-container">
                    <span class="weather-arrow-label">3h</span>
                    <span class="material-symbols-outlined weather-arrow-icon">arrow_right</span>
                </div>
                <img id="weather-icon-3h" class="weather-icon-img" src="" alt="Tempo 3h">
            </div>

            <div class="temp-humidity-row">
                <div class="temp-group">
                    <img src="https://raw.githubusercontent.com/erikflowers/weather-icons/master/svg/wi-thermometer.svg" class="wi-icon-small" alt="Termômetro">
                    <span id="temp-now">--</span>ºC
                </div>
                <div class="humidity-group">
                    <span class="material-symbols-outlined">water_drop</span>
                    <span id="humidity-text">--%</span>
                </div>
            </div>

            <div class="weather-details">
                <div class="rain-table-container">
                    <span class="material-symbols-outlined">rainy</span>
                    <div class="rain-columns">
                        <div class="rain-col">
                            <span class="rain-header">3h</span>
                            <b id="rain-3h">--%</b>
                        </div>
                        <div class="rain-col">
                            <span class="rain-header">12h</span>
                            <b id="rain-12h">--%</b>
                        </div>
                    </div>
                </div>

                <div class="temp-min-max">
                    <div class="item">
                        <span class="material-symbols-outlined">ac_unit</span>
                        <b id="temp-min">--</b>ºC
                    </div>
                    |
                    <div class="item">
                        <span class="material-symbols-outlined">sunny</span>
                        <b id="temp-max">--</b>ºC
                    </div>
                </div>
                
                <div id="wind-info">
                    <span class="material-symbols-outlined">air</span>
                    <span id="wind-arrow-now" class="material-symbols-outlined wind-arrow">navigation</span>
                    <span id="wind-now-text">-- / --</span>
                    <span class="material-symbols-outlined">arrow_right</span>
                    <span id="wind-arrow-3h" class="material-symbols-outlined wind-arrow">navigation</span>
                    <span id="wind-3h-text">-- / --</span>
                </div>

                <div class="progress-bar-container">
                    <div id="update-progress-bar" class="progress-bar-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="settings-overlay" class="settings-overlay hidden">
        <div class="settings-box">
            <h2>Configurações</h2>
            <div class="input-group">
                <label for="lat-input">Latitude:</label>
                <input type="text" id="lat-input">
            </div>
            <div class="input-group">
                <label for="lon-input">Longitude:</label>
                <input type="text" id="lon-input">
            </div>
            <div class="input-group">
                <label for="font-select">Fonte do Relógio:</label>
                <select id="font-select">
                    <option value="'Roboto Condensed', sans-serif">Roboto</option>
                    <option value="'Offside', cursive">Offside</option>
                    <option value="'Audiowide', cursive">Audiowide</option>
                    <option value="'Zen Dots', cursive">Zen Dots</option>
                    <option value="'Outfit', sans-serif">Qanelas Soft Extra Bold</option>
                </select>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="seconds-checkbox">
                <label for="seconds-checkbox">Exibir Segundos</label>
            </div>
            <button id="get-location-btn">Usar Localização Atual <span id="location-spinner" class="spinner hidden"></span></button>
            <button id="close-settings-btn">Salvar &amp; Fechar</button>
        </div>
    </div>

    <script>
        let currentLat = localStorage.getItem('lat') || "-27.5692";
        let currentLon = localStorage.getItem('lon') || "-48.6104";
        let showSeconds = localStorage.getItem('showSeconds') === 'true';
        let clockFont = localStorage.getItem('clockFont') || "'Roboto Condensed', sans-serif";

        const API_URL = "https://api.open-meteo.com/v1/forecast";
        const HOURLY_VARS = "temperature_2m,relative_humidity_2m,precipitation_probability,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m";
        const DAILY_VARS = "temperature_2m_max,temperature_2m_min";
        const ICON_BASE_URL = "https://raw.githubusercontent.com/erikflowers/weather-icons/master/svg/";

        const UPDATE_INTERVAL_MS = 1800000;
        let lastFetchTime = Date.now();

        let prevHours = null, prevMinutes = null, prevSeconds = null;
        let wakeLock = null;

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {
                    console.error(`Wake Lock Error: ${err.name}, ${err.message}`);
                }
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });

        // Tabela de compensação vertical específica para a métrica de cada fonte
        const fontOffsets = {
            "'Roboto Condensed', sans-serif": "-1.8%",
            "'Offside', cursive": "-4.5%",
            "'Audiowide', cursive": "-2.0%",
            "'Zen Dots', cursive": "-3.0%",
            "'Outfit', sans-serif": "-1.0%"
        };

        function applyFont(fontFamily) {
            const elements = document.querySelectorAll('.flip-clock-card, .seconds-card');
            elements.forEach(el => el.style.fontFamily = fontFamily);
            
            const offset = fontOffsets[fontFamily] || "0px";
            document.documentElement.style.setProperty('--font-offset', offset);
        }

        function flipCard(cardId, newValue) {
            const card = document.getElementById(cardId);
            const topFront = card.querySelector('.top-front .card-text');
            const bottomFront = card.querySelector('.bottom-front .card-text');
            const topBack = card.querySelector('.top-back .card-text');
            const bottomBack = card.querySelector('.bottom-back .card-text');

            const currentValue = topFront.textContent;
            if (currentValue === newValue) return;

            topBack.textContent = newValue;
            bottomBack.textContent = currentValue;

            topFront.textContent = currentValue;
            bottomFront.textContent = newValue;

            card.classList.remove('flipping');
            void card.offsetWidth;
            card.classList.add('flipping');

            setTimeout(() => {
                topFront.textContent = newValue;
                bottomBack.textContent = newValue;
                card.classList.remove('flipping');
            }, cardId === 'seconds-card' ? 400 : 500);
        }

        function updateProgressBar() {
            const elapsed = Date.now() - lastFetchTime;
            const progress = Math.min(100, Math.max(0, (elapsed / UPDATE_INTERVAL_MS) * 100));
            document.getElementById('update-progress-bar').style.width = `${progress}%`;
        }

        function updateTime() {
            const now = new Date();
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            if (prevHours === null) {
                ['hours-card', 'minutes-card', 'seconds-card'].forEach(id => {
                    const c = document.getElementById(id);
                    const val = id === 'hours-card' ? hours : (id === 'minutes-card' ? minutes : seconds);
                    c.querySelectorAll('.card-text').forEach(f => f.textContent = val);
                });
            } else {
                if (hours !== prevHours) flipCard('hours-card', hours);
                if (minutes !== prevMinutes) flipCard('minutes-card', minutes);
                if (showSeconds && seconds !== prevSeconds) flipCard('seconds-card', seconds);
            }

            prevHours = hours;
            prevMinutes = minutes;
            prevSeconds = seconds;

            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            document.getElementById('date-label').textContent = `${day}/${month}/${year}`;

            const weekDay = now.toLocaleDateString('pt-BR', { weekday: 'long' });
            document.getElementById('day-label').textContent = weekDay.toLowerCase();

            updateProgressBar();
        }

        function getWeatherIconName(code) {
            const iconMap = {
                0: "wi-day-sunny.svg", 1: "wi-day-cloudy.svg", 2: "wi-cloudy.svg",
                3: "wi-cloudy.svg", 45: "wi-fog.svg", 48: "wi-fog.svg",
                51: "wi-sprinkle.svg", 53: "wi-sprinkle.svg", 55: "wi-sprinkle.svg",
                56: "wi-sleet.svg", 57: "wi-sleet.svg", 61: "wi-day-rain.svg",
                63: "wi-rain.svg", 65: "wi-rain.svg", 66: "wi-sleet.svg",
                67: "wi-sleet.svg", 71: "wi-snow.svg", 73: "wi-snow.svg",
                75: "wi-snow.svg", 77: "wi-snow.svg", 80: "wi-day-showers.svg",
                81: "wi-showers.svg", 82: "wi-showers.svg", 85: "wi-day-snow.svg",
                86: "wi-day-snow.svg", 95: "wi-thunderstorm.svg",
                96: "wi-storm-showers.svg", 99: "wi-storm-showers.svg",
            };
            return iconMap[code] || "wi-na.svg";
        }

        async function fetchWeather() {
            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

            const params = new URLSearchParams({
                latitude: currentLat,
                longitude: currentLon,
                hourly: HOURLY_VARS,
                daily: DAILY_VARS,
                timezone: timezone,
                forecast_days: "2"
            });
            const url = `${API_URL}?${params}`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const data = await response.json();
                if (data.error) return;

                lastFetchTime = Date.now();
                updateProgressBar();

                const hourly = data.hourly;
                const daily = data.daily;
                
                const now = new Date();
                const currentHourISO = now.toISOString().slice(0, 13);
                let curIdx = hourly.time.findIndex(t => t.startsWith(currentHourISO));
                if (curIdx === -1) curIdx = 0;
                
                const idx3h = Math.min(curIdx + 3, hourly.time.length - 1);

                const iconNow = getWeatherIconName(hourly.weather_code[curIdx]);
                const icon3h = getWeatherIconName(hourly.weather_code[idx3h]);
                document.getElementById('weather-icon-now').src = `${ICON_BASE_URL}${iconNow}`;
                document.getElementById('weather-icon-3h').src = `${ICON_BASE_URL}${icon3h}`;

                const tempNow = Math.round(hourly.temperature_2m[curIdx]);
                document.getElementById('temp-now').textContent = tempNow;

                const humidity = hourly.relative_humidity_2m[curIdx];
                document.getElementById('humidity-text').textContent = `${humidity}%`;

                const rain3hSlice = hourly.precipitation_probability.slice(curIdx, curIdx + 3);
                const rain12hSlice = hourly.precipitation_probability.slice(curIdx, curIdx + 12);
                const maxRain3h = Math.max(...rain3hSlice);
                const maxRain12h = Math.max(...rain12hSlice);
                document.getElementById('rain-3h').textContent = `${maxRain3h}%`;
                document.getElementById('rain-12h').textContent = `${maxRain12h}%`;

                const tempMax = Math.round(daily.temperature_2m_max[0]);
                const tempMin = Math.round(daily.temperature_2m_min[0]);
                document.getElementById('temp-min').textContent = tempMin;
                document.getElementById('temp-max').textContent = tempMax;

                const wSpeedNow = Math.round(hourly.wind_speed_10m[curIdx]);
                const wGustNow = Math.round(hourly.wind_gusts_10m[curIdx]);
                const wDirNow = (hourly.wind_direction_10m[curIdx] + 180) % 360;

                const wSpeed3h = Math.round(hourly.wind_speed_10m[idx3h]);
                const wGust3h = Math.round(hourly.wind_gusts_10m[idx3h]);
                const wDir3h = (hourly.wind_direction_10m[idx3h] + 180) % 360;

                document.getElementById('wind-arrow-now').style.transform = `rotate(${wDirNow}deg)`;
                document.getElementById('wind-now-text').textContent = `${wSpeedNow} / ${wGustNow}`;

                document.getElementById('wind-arrow-3h').style.transform = `rotate(${wDir3h}deg)`;
                document.getElementById('wind-3h-text').textContent = `${wSpeed3h} / ${wGust3h}`;

            } catch (error) {
                console.error("Error fetching weather data:", error);
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {});
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            requestWakeLock();
            
            applyFont(clockFont);
            updateTime();
            setInterval(updateTime, 1000);
            
            fetchWeather();
            setInterval(fetchWeather, UPDATE_INTERVAL_MS);

            const secContainer = document.getElementById('seconds-container');
            if (showSeconds) secContainer.classList.remove('hidden');

            let pressTimer;
            let isLongPress = false;

            function startPress(e) {
                if (e.target.closest('#settings-overlay')) return;
                isLongPress = false;
                pressTimer = window.setTimeout(function () {
                    isLongPress = true;
                    const settingsOverlay = document.getElementById('settings-overlay');
                    document.getElementById('lat-input').value = currentLat;
                    document.getElementById('lon-input').value = currentLon;
                    document.getElementById('seconds-checkbox').checked = showSeconds;
                    document.getElementById('font-select').value = clockFont;
                    settingsOverlay.classList.remove('hidden');
                }, 1000);
            }

            function cancelPress() { clearTimeout(pressTimer); }

            const body = document.body;
            body.addEventListener("mousedown", startPress);
            body.addEventListener("touchstart", startPress, { passive: true });
            body.addEventListener("mouseup", cancelPress);
            body.addEventListener("mouseleave", cancelPress);
            body.addEventListener("touchend", cancelPress);
            body.addEventListener("touchcancel", cancelPress);

            body.addEventListener('click', e => {
                if (isLongPress || e.target.closest('#settings-overlay')) return;
                toggleFullScreen();
            });

            document.getElementById('close-settings-btn').addEventListener('click', () => {
                const lat = document.getElementById('lat-input').value;
                const lon = document.getElementById('lon-input').value;
                const secChecked = document.getElementById('seconds-checkbox').checked;
                const selectedFont = document.getElementById('font-select').value;

                if (lat && lon) {
                    currentLat = lat;
                    currentLon = lon;
                    localStorage.setItem('lat', lat);
                    localStorage.setItem('lon', lon);
                }

                showSeconds = secChecked;
                localStorage.setItem('showSeconds', secChecked);

                clockFont = selectedFont;
                localStorage.setItem('clockFont', selectedFont);
                applyFont(clockFont);

                if (showSeconds) secContainer.classList.remove('hidden');
                else secContainer.classList.add('hidden');

                fetchWeather();
                document.getElementById('settings-overlay').classList.add('hidden');
            });

            document.getElementById('get-location-btn').addEventListener('click', () => {
                const spinner = document.getElementById('location-spinner');
                if ('geolocation' in navigator) {
                    spinner.classList.remove('hidden');
                    navigator.geolocation.getCurrentPosition(position => {
                        const lat = position.coords.latitude.toFixed(4);
                        const lon = position.coords.longitude.toFixed(4);
                        document.getElementById('lat-input').value = lat;
                        document.getElementById('lon-input').value = lon;
                        spinner.classList.add('hidden');
                    }, error => {
                        alert("Não foi possível obter a localização.");
                        spinner.classList.add('hidden');
                    });
                }
            });
        });
    </script>
</body>
</html>
