<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Weather Flip Clock</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Roboto Condensed', sans-serif;
            margin: 0;
            overflow: hidden;
            display: flex;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* CONTAINER PRINCIPAL */
        .container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            padding: 1.5vh 1.5vw;
            justify-content: space-between;
            gap: 1.5vh;
        }

        /* BARRA SUPERIOR */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1c1c1e;
            border-radius: 2vmin;
            padding: 1vh 2vw;
            font-size: clamp(14px, 2.2vh, 20px);
            font-weight: 700;
            color: #b5b5b7;
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 1vw;
        }

        .header-center {
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #fff;
        }

        /* --------------------------------------------------
           ÁREA PRINCIPAL (HOJE - AMANHÃ - RELÓGIO)
        -------------------------------------------------- */
        .main-content {
            display: flex;
            flex-direction: row;
            flex: 1;
            width: 100%;
            gap: 2vw;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }

        /* --------------------------------------------------
           CARDS CLIMA VERTICAIS
        -------------------------------------------------- */
        .weather-card-vertical {
            background: #1c1c1e;
            border-radius: 4vmin;
            padding: 3vh 2vw;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            height: clamp(120px, 32vw, 62vh);
            width: clamp(230px, 30vw, 48vh);
        }

        .card-day-label {
            font-size: clamp(16px, 3vh, 24px);
            font-weight: 800;
            color: #b5b5b7;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .weather-icon-large {
            width: clamp(50px, 7vw, 12vh);
            height: clamp(50px, 7vw, 12vh);
            filter: invert(1);
        }

        .temp-display {
            font-size: clamp(30px, 6vh, 5vw);
            font-weight: 800;
            line-height: 1;
            color: #fff;
        }

        .temp-range-block {
            display: flex;
            gap: 1vw;
            font-size: clamp(14px, 2.5vh, 2vw);
            font-weight: 700;
        }

        .temp-min-val { color: #7be1ff; }
        .temp-max-val { color: #ff7b7b; }

        .metrics-block {
            display: flex;
            flex-direction: column;
            width: 100%;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            padding-top: 2.5vh;
            align-items: center;
        }

        .metrics-wrapper {
            display: flex;
            flex-direction: column;
            gap: 1.5vh;
            align-items: flex-start;
        }

        .metric-item {
            display: flex;
            align-items: center;
            gap: 0.4em;
            font-size: clamp(30px, 6vh, 5vw);
            font-weight: 800;
            color: #ddd;
        }

        .metric-item .material-symbols-outlined {
            font-size: 1.1em;
            color: #aaa;
        }

        .wind-arrow-inline {
            display: inline-block;
            transition: transform 0.3s ease;
        }

        /* --------------------------------------------------
           RELÓGIO
        -------------------------------------------------- */
        .clock-container {
            display: flex;
            gap: 2vw;
            justify-content: center;
            align-items: center;
        }

        .clock-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .flip-clock-card {
            position: relative;
            width: clamp(120px, 32vw, 62vh);
            height: clamp(120px, 32vw, 62vh);
            background: #1c1c1e;
            border-radius: 4vmin;
            font-family: 'Roboto Condensed', sans-serif;
            font-weight: 800;
            font-size: clamp(100px, 26vw, 52vh);
            line-height: 1;
            color: #b5b5b7;
            perspective: 1000px;
        }

        .card-face {
            position: absolute;
            left: 0;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: #1c1c1e;
            user-select: none;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .card-text {
            position: absolute;
            left: 0;
            width: 100%;
            height: 200%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1;
        }

        .card-face.top {
            top: 0;
            border-top-left-radius: 4vmin;
            border-top-right-radius: 4vmin;
        }
        .card-face.top .card-text { top: 0; }

        .card-face.bottom {
            bottom: 0;
            border-bottom-left-radius: 4vmin;
            border-bottom-right-radius: 4vmin;
        }
        .card-face.bottom .card-text { bottom: 0; }

        .flip-clock-card .top-back { z-index: 1; }
        .flip-clock-card .bottom-back { z-index: 2; }
        .flip-clock-card .top-front { z-index: 3; transform-origin: bottom; }
        .flip-clock-card .bottom-front { z-index: 4; transform-origin: top; transform: rotateX(90deg); }

        .flip-clock-card.flipping .top-front { animation: flipTopFront 0.25s ease-in forwards; }
        .flip-clock-card.flipping .bottom-front { animation: flipBottomFront 0.25s ease-out 0.25s forwards; }

        @keyframes flipTopFront {
            0% { transform: rotateX(0deg); }
            100% { transform: rotateX(-90deg); }
        }

        @keyframes flipBottomFront {
            0% { transform: rotateX(90deg); }
            100% { transform: rotateX(0deg); }
        }

        .flip-clock-card::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: #000;
            z-index: 10;
            transform: translateY(-50%);
        }

        /* --------------------------------------------------
           PROGRESSBAR E SEGUNDOS
        -------------------------------------------------- */
        .circular-progress {
            width: clamp(14px, 2.5vw, 4vh);
            height: clamp(14px, 2.5vw, 4vh);
            border-radius: 50%;
            background: conic-gradient(rgba(255, 255, 255, 0.4) 0deg, rgba(255, 255, 255, 0.05) 0deg);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .circular-progress::after {
            content: '';
            position: absolute;
            width: 76%;
            height: 76%;
            background: #1c1c1e;
            border-radius: 50%;
        }

        .seconds-container {
            position: absolute;
            bottom: 2vmin;
            right: 2vmin;
            z-index: 20;
            display: flex;
        }

        .seconds-card {
            position: relative;
            width: clamp(28px, 6vw, 11vh);
            height: clamp(22px, 4.5vw, 9vh);
            background: #1c1c1e;
            border-top-left-radius: 1.5vmin;
            border-top-right-radius: 1.5vmin;
            border-bottom-left-radius: 4vmin;
            border-bottom-right-radius: 4vmin;
            font-family: 'Roboto Condensed', sans-serif;
            font-weight: 800;
            font-size: clamp(20px, 4vw, 8vh);
            line-height: 1;
            color: #b5b5b7;
            perspective: 500px;
            overflow: hidden;
        }

        .seconds-card .card-face { background: #1c1c1e; }
        .seconds-card .card-face.top { border-top-left-radius: 1.5vmin; border-top-right-radius: 1.5vmin; }
        .seconds-card .card-face.bottom { border-bottom-left-radius: 4vmin; border-bottom-right-radius: 4vmin; }

        .seconds-card .top-back { z-index: 1; }
        .seconds-card .bottom-back { z-index: 2; }
        .seconds-card .top-front { z-index: 3; transform-origin: bottom; }
        .seconds-card .bottom-front { z-index: 4; transform-origin: top; transform: rotateX(90deg); }

        .seconds-card.flipping .top-front { animation: flipTopFront 0.2s ease-in forwards; }
        .seconds-card.flipping .bottom-front { animation: flipBottomFront 0.2s ease-out 0.2s forwards; }

        .seconds-card::after { display: none; }
        .seconds-container.hidden { display: none; }

        /* CONFIGURAÇÕES */
        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .settings-overlay.hidden { display: none; }

        .settings-box {
            background: #111;
            padding: 1.5em;
            border: 1px solid #333;
            border-radius: 12px;
            text-align: center;
            min-width: 280px;
            max-width: 90vw;
            color: #fff;
        }

        .settings-box h2 { margin-top: 0; font-family: 'Roboto Condensed', sans-serif; }

        .input-group { margin-bottom: 0.8em; text-align: left; }
        .input-group label { display: block; margin-bottom: 0.3em; font-size: 0.85em; }

        .input-group input[type="text"] {
            box-sizing: border-box;
            width: 100%;
            padding: 0.5em;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            font-family: inherit;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5em;
            margin-bottom: 0.8em;
            text-align: left;
            cursor: pointer;
        }

        .checkbox-group input { width: 1.1em; height: 1.1em; cursor: pointer; }

        .settings-box button {
            background: #333;
            color: #fff;
            border: none;
            padding: 0.6em 1.2em;
            border-radius: 6px;
            font-family: inherit;
            cursor: pointer;
            margin: 0.2em;
        }

        .settings-box button:hover { background: #555; }

        .spinner {
            display: inline-block;
            width: 1em;
            height: 1em;
            vertical-align: -0.125em;
            border: 0.15em solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spin .75s linear infinite;
            margin-left: 0.5em;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="main-container" class="container">
        
        <!-- BARRA SUPERIOR -->
        <div class="header-bar">
            <div class="header-left"></div>
            <div id="header-date-day" class="header-center">10/08/2026 • Segunda-feira</div>
            <div class="header-right">
                <div id="progress-container">
                    <div id="circular-progress-bar" class="circular-progress"></div>
                </div>
            </div>
        </div>

        <!-- ÁREA CENTRAL (HOJE - AMANHÃ - RELÓGIO) -->
        <div class="main-content">
            
            <!-- HOJE -->
            <div class="weather-card-vertical">
                <div class="card-day-label">Hoje</div>
                <img id="weather-icon-today" class="weather-icon-large" src="" alt="Hoje">
                <div class="temp-display"><span id="temp-today">--</span>ºC</div>
                <div class="temp-range-block">
                    <span class="temp-min-val"><b id="temp-min-today">--</b>ºC</span>
                    <span class="temp-max-val"><b id="temp-max-today">--</b>ºC</span>
                </div>
                
                <div class="metrics-block">
                    <div class="metrics-wrapper">
                        <div class="metric-item">
                            <span class="material-symbols-outlined">rainy</span>
                            <span id="rain-today">--%</span>
                        </div>
                        <div class="metric-item">
                            <span class="material-symbols-outlined">water_drop</span>
                            <span id="humidity-today">--%</span>
                        </div>
                        <div class="metric-item">
                            <span id="wind-arrow-today" class="material-symbols-outlined wind-arrow-inline">navigation</span>
                            <span id="wind-today">--</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- AMANHÃ -->
            <div class="weather-card-vertical">
                <div class="card-day-label">Amanhã</div>
                <img id="weather-icon-tomorrow" class="weather-icon-large" src="" alt="Amanhã">
                <div class="temp-display"><span id="temp-tomorrow">--</span>ºC</div>
                <div class="temp-range-block">
                    <span class="temp-min-val"><b id="temp-min-tomorrow">--</b>ºC</span>
                    <span class="temp-max-val"><b id="temp-max-tomorrow">--</b>ºC</span>
                </div>
                
                <div class="metrics-block">
                    <div class="metrics-wrapper">
                        <div class="metric-item">
                            <span class="material-symbols-outlined">rainy</span>
                            <span id="rain-tomorrow">--%</span>
                        </div>
                        <div class="metric-item">
                            <span class="material-symbols-outlined">water_drop</span>
                            <span id="humidity-tomorrow">--%</span>
                        </div>
                        <div class="metric-item">
                            <span id="wind-arrow-tomorrow" class="material-symbols-outlined wind-arrow-inline">navigation</span>
                            <span id="wind-tomorrow">--</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RELÓGIO -->
            <div class="clock-container">
                <div class="clock-column">
                    <div id="hours-card" class="flip-clock-card">
                        <div class="card-face top top-back"><div class="card-text">00</div></div>
                        <div class="card-face bottom bottom-back"><div class="card-text">00</div></div>
                        <div class="card-face top top-front"><div class="card-text">00</div></div>
                        <div class="card-face bottom bottom-front"><div class="card-text">00</div></div>
                    </div>
                </div>

                <div class="clock-column">
                    <div id="minutes-card" class="flip-clock-card">
                        <div class="card-face top top-back"><div class="card-text">00</div></div>
                        <div class="card-face bottom bottom-back"><div class="card-text">00</div></div>
                        <div class="card-face top top-front"><div class="card-text">00</div></div>
                        <div class="card-face bottom bottom-front"><div class="card-text">00</div></div>

                        <div id="seconds-container" class="seconds-container hidden">
                            <div id="seconds-card" class="seconds-card">
                                <div class="card-face top top-back"><div class="card-text">00</div></div>
                                <div class="card-face bottom bottom-back"><div class="card-text">00</div></div>
                                <div class="card-face top top-front"><div class="card-text">00</div></div>
                                <div class="card-face bottom bottom-front"><div class="card-text">00</div></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- CONFIGURAÇÕES -->
    <div id="settings-overlay" class="settings-overlay hidden">
        <div class="settings-box">
            <h2>Configurações</h2>
            <div class="input-group">
                <label for="lat-input">Latitude:</label>
                <input type="text" id="lat-input">
            </div>
            <div class="input-group">
                <label for="lon-input">Longitude:</label>
                <input type="text" id="lon-input">
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="seconds-checkbox">
                <label for="seconds-checkbox">Exibir Segundos</label>
            </div>
            <button id="get-location-btn">Usar Localização Atual <span id="location-spinner" class="spinner hidden"></span></button>
            <button id="close-settings-btn">Salvar &amp; Fechar</button>
        </div>
    </div>

    <script>
        let currentLat = localStorage.getItem('lat') || "-27.5692";
        let currentLon = localStorage.getItem('lon') || "-48.6104";
        let showSeconds = localStorage.getItem('showSeconds') === 'true';

        const API_URL = "https://api.open-meteo.com/v1/forecast";
        const HOURLY_VARS = "temperature_2m,relative_humidity_2m,precipitation_probability,weather_code,wind_speed_10m,wind_direction_10m";
        const DAILY_VARS = "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max,wind_direction_10m_dominant";
        const ICON_BASE_URL = "https://raw.githubusercontent.com/erikflowers/weather-icons/master/svg/";

        const UPDATE_INTERVAL_MS = 1800000;
        let lastFetchTime = Date.now();

        let prevHours = null, prevMinutes = null, prevSeconds = null;
        let wakeLock = null;

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {
                    console.error(`Wake Lock Error: ${err.name}, ${err.message}`);
                }
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });

        function flipCard(cardId, newValue) {
            const card = document.getElementById(cardId);
            const topFront = card.querySelector('.top-front .card-text');
            const bottomFront = card.querySelector('.bottom-front .card-text');
            const topBack = card.querySelector('.top-back .card-text');
            const bottomBack = card.querySelector('.bottom-back .card-text');

            const currentValue = topFront.textContent;
            if (currentValue === newValue) return;

            topBack.textContent = newValue;
            bottomBack.textContent = currentValue;

            topFront.textContent = currentValue;
            bottomFront.textContent = newValue;

            card.classList.remove('flipping');
            void card.offsetWidth;
            card.classList.add('flipping');

            setTimeout(() => {
                topFront.textContent = newValue;
                bottomBack.textContent = newValue;
                card.classList.remove('flipping');
            }, cardId === 'seconds-card' ? 400 : 500);
        }

        function updateProgressBar() {
            const elapsed = Date.now() - lastFetchTime;
            const progress = Math.min(100, Math.max(0, (elapsed / UPDATE_INTERVAL_MS) * 100));
            const degrees = (progress / 100) * 360;
            
            const circularElement = document.getElementById('circular-progress-bar');
            circularElement.style.background = `conic-gradient(rgba(255, 255, 255, 0.4) ${degrees}deg, rgba(255, 255, 255, 0.05) ${degrees}deg)`;
        }

        function updateTime() {
            const now = new Date();
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            if (prevHours === null) {
                ['hours-card', 'minutes-card', 'seconds-card'].forEach(id => {
                    const c = document.getElementById(id);
                    if (!c) return;
                    const val = id === 'hours-card' ? hours : (id === 'minutes-card' ? minutes : seconds);
                    c.querySelectorAll('.card-text').forEach(f => f.textContent = val);
                });
            } else {
                if (hours !== prevHours) flipCard('hours-card', hours);
                if (minutes !== prevMinutes) flipCard('minutes-card', minutes);
                if (showSeconds && seconds !== prevSeconds) flipCard('seconds-card', seconds);
            }

            prevHours = hours;
            prevMinutes = minutes;
            prevSeconds = seconds;

            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            const weekDay = now.toLocaleDateString('pt-BR', { weekday: 'long' });
            
            const formattedWeekDay = weekDay.charAt(0).toUpperCase() + weekDay.slice(1);
            document.getElementById('header-date-day').textContent = `${day}/${month}/${year} • ${formattedWeekDay}`;

            updateProgressBar();
        }

        function getWeatherIconName(code) {
            const iconMap = {
                0: "wi-day-sunny.svg", 1: "wi-day-cloudy.svg", 2: "wi-cloudy.svg",
                3: "wi-cloudy.svg", 45: "wi-fog.svg", 48: "wi-fog.svg",
                51: "wi-sprinkle.svg", 53: "wi-sprinkle.svg", 55: "wi-sprinkle.svg",
                56: "wi-sleet.svg", 57: "wi-sleet.svg", 61: "wi-day-rain.svg",
                63: "wi-rain.svg", 65: "wi-rain.svg", 66: "wi-sleet.svg",
                67: "wi-sleet.svg", 71: "wi-snow.svg", 73: "wi-snow.svg",
                75: "wi-snow.svg", 77: "wi-snow.svg", 80: "wi-day-showers.svg",
                81: "wi-showers.svg", 82: "wi-showers.svg", 85: "wi-day-snow.svg",
                86: "wi-day-snow.svg", 95: "wi-thunderstorm.svg",
                96: "wi-storm-showers.svg", 99: "wi-storm-showers.svg",
            };
            return iconMap[code] || "wi-na.svg";
        }

        async function fetchWeather() {
            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

            const params = new URLSearchParams({
                latitude: currentLat,
                longitude: currentLon,
                hourly: HOURLY_VARS,
                daily: DAILY_VARS,
                timezone: timezone,
                forecast_days: "2"
            });
            const url = `${API_URL}?${params}`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const data = await response.json();
                if (data.error) return;

                lastFetchTime = Date.now();
                updateProgressBar();

                const hourly = data.hourly;
                const daily = data.daily;
                
                const now = new Date();
                const currentHourISO = now.toISOString().slice(0, 13);
                let curIdx = hourly.time.findIndex(t => t.startsWith(currentHourISO));
                if (curIdx === -1) curIdx = 0;

                // --- CLIMA HOJE ---
                const iconToday = getWeatherIconName(hourly.weather_code[curIdx]);
                document.getElementById('weather-icon-today').src = `${ICON_BASE_URL}${iconToday}`;
                document.getElementById('temp-today').textContent = Math.round(hourly.temperature_2m[curIdx]);
                document.getElementById('temp-max-today').textContent = Math.round(daily.temperature_2m_max[0]);
                document.getElementById('temp-min-today').textContent = Math.round(daily.temperature_2m_min[0]);
                
                document.getElementById('rain-today').textContent = `${hourly.precipitation_probability[curIdx]}%`;
                
                // Umidade Hoje com regra de cor
                const humToday = hourly.relative_humidity_2m[curIdx];
                const humTodayEl = document.getElementById('humidity-today');
                humTodayEl.textContent = `${humToday}%`;
                humTodayEl.style.color = humToday < 85 ? '#7be1ff' : '';

                // Vento Hoje
                document.getElementById('wind-today').textContent = Math.round(hourly.wind_speed_10m[curIdx]);
                const dirToday = (hourly.wind_direction_10m[curIdx] + 180) % 360;
                document.getElementById('wind-arrow-today').style.transform = `rotate(${dirToday}deg)`;


                // --- CLIMA AMANHÃ ---
                const iconTomorrow = getWeatherIconName(daily.weather_code[1]);
                document.getElementById('weather-icon-tomorrow').src = `${ICON_BASE_URL}${iconTomorrow}`;
                const avgTomorrowTemp = Math.round((daily.temperature_2m_max[1] + daily.temperature_2m_min[1]) / 2);
                document.getElementById('temp-tomorrow').textContent = avgTomorrowTemp;
                document.getElementById('temp-max-tomorrow').textContent = Math.round(daily.temperature_2m_max[1]);
                document.getElementById('temp-min-tomorrow').textContent = Math.round(daily.temperature_2m_min[1]);
                
                document.getElementById('rain-tomorrow').textContent = `${daily.precipitation_probability_max[1]}%`;
                
                // Umidade Amanhã com regra de cor
                let tomorrowHumiditySum = 0;
                for (let i = 24; i < 48; i++) {
                    tomorrowHumiditySum += hourly.relative_humidity_2m[i] || 0;
                }
                const humTomorrow = Math.round(tomorrowHumiditySum / 24);
                const humTomorrowEl = document.getElementById('humidity-tomorrow');
                humTomorrowEl.textContent = `${humTomorrow}%`;
                humTomorrowEl.style.color = humTomorrow < 85 ? '#7be1ff' : '';

                // Vento Amanhã
                document.getElementById('wind-tomorrow').textContent = Math.round(daily.wind_speed_10m_max[1]);
                const dirTomorrow = (daily.wind_direction_10m_dominant[1] + 180) % 360;
                document.getElementById('wind-arrow-tomorrow').style.transform = `rotate(${dirTomorrow}deg)`;


            } catch (error) {
                console.error("Error fetching weather data:", error);
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {});
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            requestWakeLock();

            updateTime();
            setInterval(updateTime, 1000);
            
            fetchWeather();
            setInterval(fetchWeather, UPDATE_INTERVAL_MS);

            const secContainer = document.getElementById('seconds-container');
            if (showSeconds) secContainer.classList.remove('hidden');

            let pressTimer;
            let isLongPress = false;

            function startPress(e) {
                if (e.target.closest('#settings-overlay')) return;
                isLongPress = false;
                pressTimer = window.setTimeout(function () {
                    isLongPress = true;
                    const settingsOverlay = document.getElementById('settings-overlay');
                    document.getElementById('lat-input').value = currentLat;
                    document.getElementById('lon-input').value = currentLon;
                    document.getElementById('seconds-checkbox').checked = showSeconds;
                    settingsOverlay.classList.remove('hidden');
                }, 1000);
            }

            function cancelPress() { clearTimeout(pressTimer); }

            const body = document.body;
            body.addEventListener("mousedown", startPress);
            body.addEventListener("touchstart", startPress, { passive: true });
            body.addEventListener("mouseup", cancelPress);
            body.addEventListener("mouseleave", cancelPress);
            body.addEventListener("touchend", cancelPress);
            body.addEventListener("touchcancel", cancelPress);

            body.addEventListener('click', e => {
                if (isLongPress || e.target.closest('#settings-overlay')) return;
                toggleFullScreen();
            });

            document.getElementById('close-settings-btn').addEventListener('click', () => {
                const lat = document.getElementById('lat-input').value;
                const lon = document.getElementById('lon-input').value;
                const secChecked = document.getElementById('seconds-checkbox').checked;

                if (lat && lon) {
                    currentLat = lat;
                    currentLon = lon;
                    localStorage.setItem('lat', lat);
                    localStorage.setItem('lon', lon);
                }

                showSeconds = secChecked;
                localStorage.setItem('showSeconds', secChecked);

                if (showSeconds) secContainer.classList.remove('hidden');
                else secContainer.classList.add('hidden');

                fetchWeather();
                document.getElementById('settings-overlay').classList.add('hidden');
            });

            document.getElementById('get-location-btn').addEventListener('click', () => {
                const spinner = document.getElementById('location-spinner');
                if ('geolocation' in navigator) {
                    spinner.classList.remove('hidden');
                    navigator.geolocation.getCurrentPosition(position => {
                        const lat = position.coords.latitude.toFixed(4);
                        const lon = position.coords.longitude.toFixed(4);
                        document.getElementById('lat-input').value = lat;
                        document.getElementById('lon-input').value = lon;
                        spinner.classList.add('hidden');
                    }, error => {
                        alert("Não foi possível obter a localização.");
                        spinner.classList.add('hidden');
                    });
                }
            });
        });
    </script>
</body>
</html>
